[project]
name = "agentic-conservation"
version = "0.1.0"
description = "Reproducible simulation of dynamic conservation networks under partial observability"
requires-python = ">=3.10"
dependencies = [
  "matplotlib==3.10.9",
  "numpy==2.2.6",
  "pandas==2.3.3",
  "python-docx==1.2.0",
  "python-pptx==1.0.2",
  "requests==2.34.2",
  "scipy==1.15.3",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "ruff==0.14.14"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
